{% extends 'base/custom_auth_base.html' %}
{% load static %}
{% load i18n %}
{% block auth_content %}
<h4 class="fw-bold mb-4">{% trans "Mot de passe réinitialisé" %}</h4>

<p style="font-size: .9rem;">
    {% trans "Votre mot de passe a bien été réinitialisé." %}
</p>

<!-- Lien pour s'identifier -->
<div id="login-link" class="text-menu mt-4">
    <div class="mt-3">
        <a href="{% url 'custom_auth:login' %}" class="register-link d-block fw-bold">
            {% trans "Identifiez-vous" %}
        </a>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isDesktop = !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);

  if (isIOS || isDesktop) {
    const link = document.getElementById("login-link");
    if (link) link.remove();  // supprime complètement le lien
  }
});
</script>
{% endblock %}
