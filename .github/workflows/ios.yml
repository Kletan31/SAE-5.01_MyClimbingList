name: iOS build

on:
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions
  # push:                   # décommente pour builder à chaque push
  #   branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/POC/my_climbing_list_poc

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Vérifie que l'app compile pour un iPhone, sans signature
      - run: flutter build ios --release --no-codesign

      # Build pour le simulateur (utilisable avec Appetize)
      - run: flutter build ios --simulator --debug
      - run: |
          cd build/ios/iphonesimulator
          zip -r Runner-simulator.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: frontend/POC/my_climbing_list_poc/build/ios/iphonesimulator/Runner-simulator.zip