# Terminaison TLS locale ; certificats propres à la machine, générés par mkcert.
events {}
http {
    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/local-certs/localhost.pem;
        ssl_certificate_key /etc/nginx/local-certs/localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name localhost 127.0.0.1;
        # Résolution Docker renouvelée si web est recréé.
        resolver 127.0.0.11 valid=10s ipv6=off;
        add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'" always;
        location / {
            set $django_upstream web:8000;
            proxy_pass http://$django_upstream;
            proxy_set_header Host $http_host;
            # Écrase toute valeur fournie par le client.
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
