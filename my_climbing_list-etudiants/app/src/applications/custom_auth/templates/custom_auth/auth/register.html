{% extends 'base/custom_auth_base.html' %}
{% load static %}
{% load i18n %}
{% block auth_content %}
<h1 class="fw-bold mb-4">{% trans "My Climbing List" %}</h1>

{% if error %}
<div class="error-banner mb-3">
    {{ error_message }}
</div>
{% endif %}

<form method="post" id="register-form" action="{% url 'custom_auth:register' %}">
    {% csrf_token %}
    <div class="username-wrapper mb-3">
        <input type="text" name="username" class="form-control" placeholder="{% trans "Nom d'utilisateur" %}" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="email-wrapper mb-3">
        <input type="email" name="email" class="form-control" placeholder="{% trans "Email" %}" autocomplete="email" required>
    </div>
    <div class="password-wrapper mb-3">
        <input type="password" id="password1" name="password1" class="form-control" placeholder="{% trans "Mot de passe" %}" autocomplete="new-password" required>
        <i id="toggle-password1" class="fa fa-eye"></i>
    </div>
    <div class="password-wrapper mb-3">
        <input type="password" id="password2" name="password2" class="form-control" placeholder="{% trans "Confirmation" %}" autocomplete="new-password" required>
        <i id="toggle-password2" class="fa fa-eye"></i>
    </div>
    <button type="submit" class="btn btn-primary mt-2">{% trans "Inscription" %}</button>
</form>

<div class="text-menu mt-4">
    <div class="mt-3">
        <a href="{% url 'custom_auth:login' %}">{% trans "Identifiez-vous" %}</a>
    </div>
    <div class="mt-3">
        <a href="{% url 'custom_auth:login_support' %}">{% trans "Contacter le support" %}</a>
    </div>
</div>
{{ block.super }}
{% endblock %}
