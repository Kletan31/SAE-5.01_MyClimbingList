<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Route Event</title>
    <link rel="icon" href="{% static 'base/automatic_request/icon/favicon.ico' %}">
</head>
<h1>Supprimer l’événement</h1>

<p>Supprimer <strong>{{ event.name }}</strong> ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
</form>

<p>
    <a href="{% url 'route_event:staff_event_list' %}">Annuler</a>
</p>
