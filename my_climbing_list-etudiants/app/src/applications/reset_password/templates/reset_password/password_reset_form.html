{% extends 'base/custom_auth_base.html' %}
{% load static %}
{% load i18n %}
{% block auth_content %}
<h4 class="fw-bold mb-4">{% trans "Réinitialiser votre mot de passe" %}</h4>

<p style="font-size: .9rem;">
    {% trans "Saisissez votre adresse e-mail." %}
</p>

<!-- Formulaire de réinitialisation du mot de passe -->
<form method="post">
    {% csrf_token %}
    <div class="email-wrapper mb-3">
        <input type="email" name="email" autocomplete="email" maxlength="254" required id="id_email" class="form-control" placeholder="{% trans "Email" %}">
    </div>
    <button type="submit" class="btn btn-primary mt-2">{% trans "Envoyer" %}</button>
</form>

<!-- Lien pour s'identifier -->
<div class="text-menu mt-4">
    <div class="mt-3">
        <a href="{% url 'custom_auth:login' %}" class="register-link d-block fw-bold">{% trans "Identifiez-vous" %}</a>
    </div>
</div>
{% endblock %}
